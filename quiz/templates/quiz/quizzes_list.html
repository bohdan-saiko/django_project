<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul {
            list-style: none;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            font-family: sans-serif;
        }

        li {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        li:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-color: #007bff;
        }

        li strong {
            display: block;
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 8px;
        }

        li span {
            font-size: 0.9rem;
            color: #666;
        }

        h1 {
            font-family: sans-serif;
            color: #222;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>Квізи категорії: {{ category.title }}</h1>

    <ul>
        {% for quiz in quizzes %}
            <li>
                <a href="/quiz/{{ quiz.id }}">{{ quiz.title }} — Автор: {{ quiz.author.username }}</a>
            </li>
        {% empty %}
            <li>У цій категорії поки немає квізів.</li>
        {% endfor %}
    </ul>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul {
            list-style: none;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            font-family: sans-serif;
        }

        li {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        li:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-color: #007bff;
        }

        li strong {
            display: block;
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 8px;
        }

        li span {
            font-size: 0.9rem;
            color: #666;
        }

        h1 {
            font-family: sans-serif;
            color: #222;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>Ваші квізи</h1>

    <ul>
        {% for quiz in quizzes %}
            <li>
                <strong>{{ quiz.title }}</strong>
                <p>{{ quiz.description }}</p>
                <div class="actions">
                    <a href="{% url 'add_question' quiz.id %}" class="btn">Питання</a>
                    <a href="{% url 'edit_quiz_metadata' quiz.id %}" class="btn-settings">⚙️</a>
                    
                    <form action="{% url 'delete_quiz' quiz.id %}" method="post" style="display:inline;" 
                        onsubmit="return confirm('Ви впевнені, що хочете видалити цей квіз?');">
                        {% csrf_token %}
                        <button type="submit" class="btn-delete" style="background: none; border: none; color: red; cursor: pointer;">
                            🗑️ Видалити
                        </button>
                    </form>
                </div>
            </li>
        {% empty %}
            <li>У вас поки немає створених квізів.</li>
        {% endfor %}
    </ul>
</body>
</html>

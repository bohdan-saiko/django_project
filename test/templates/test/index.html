<!DOCTYPE html>
<html>
<head>
    <title>Тести</title>
</head>
<body>
    <h1>Список тестів</h1>
    <hr>
    {% for art in tests %}
        <div style="border: 1px solid #ccc; margin: 10px; padding: 10px;">
            <h3>{{ art.title }}</h3>
            <p>{{ art.content }}</p>
            <small>Автор: {{ art.author.username }} | {{ art.created_at }}</small>
        </div>
    {% empty %}
        <p>Тестів ще немає</p>
    {% endfor %}
</body>
</html>
